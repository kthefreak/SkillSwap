<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --font-display:'Archivo','Segoe UI',sans-serif;
    --font-body:'Work Sans','Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','Consolas',monospace;

    /* Monochrome ink-on-paper system — deliberately single-theme (no dark mode):
       a solid fill = something on offer, an ink outline = something sought. */
    --bg:#EDEBE2;
    --surface:#FFFFFF;
    --surface-2:#E4E1D6;
    --ink:#17160F;
    --ink-muted:#6E6A5A;
    --ink-faint:#9D9887;
    --line:rgba(23,22,15,0.15);
    --line-strong:rgba(23,22,15,0.34);
    --teach:#17160F;
    --teach-ink:#17160F;
    --teach-soft:rgba(23,22,15,0.06);
    --learn:#17160F;
    --learn-ink:#17160F;
    --learn-soft:rgba(23,22,15,0.05);
    --danger:#93381F;
    --danger-soft:rgba(147,56,31,0.10);
    --shadow-sm:0 1px 2px rgba(23,22,15,0.08);
    --shadow-lg:0 22px 44px -26px rgba(23,22,15,0.32);
    --radius-card:6px;
    --radius-sm:4px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:var(--font-display);
    font-weight:600;
    line-height:1.18;
    margin:0;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
  a{color:inherit;}
  svg{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;flex:none;}
  ::selection{background:var(--teach-soft);}
  :focus-visible{outline:2px solid var(--teach);outline-offset:2px;}
  .mono{font-family:var(--font-mono);}
  .u-caps{text-transform:uppercase;letter-spacing:0.08em;font-size:11.5px;font-weight:700;color:var(--ink-faint);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:999px;border:1px solid transparent;
    padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:0.85;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-soft{background:var(--surface-2);color:var(--ink);}
  .btn-soft:hover{border-color:var(--line-strong);}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:7px 14px;font-size:12.5px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;flex:none;}

  /* ---------- shell ---------- */
  #app{min-height:100vh;}
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .rail{
    background:var(--surface);border-right:1px solid var(--line);
    padding:22px 14px;display:flex;flex-direction:column;gap:22px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px;}
  .brand-mark{
    width:32px;height:32px;border-radius:4px;flex:none;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:var(--bg);font-size:15px;
  }
  .brand-word{font-family:var(--font-display);font-weight:800;font-size:16.5px;letter-spacing:-0.02em;}
  nav.railnav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
    color:var(--ink-muted);font-weight:600;font-size:13.6px;cursor:pointer;border:1px solid transparent;
    position:relative;
  }
  .nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;}
  .nav-item:hover{background:var(--surface-2);color:var(--ink);}
  .nav-item.active{background:var(--ink);color:var(--bg);}
  .nav-item.active svg{stroke:var(--bg);}
  .rail-spacer{flex:1;}
  .rail-user{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);
    cursor:pointer;background:var(--surface-2);
  }
  .rail-user:hover{border-color:var(--line-strong);}
  .rail-foot{font-size:11px;color:var(--ink-faint);padding:0 8px;}

  .main{padding:30px 40px 70px;max-width:1220px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;}
  .topbar .sub{color:var(--ink-muted);margin-top:6px;font-size:14.5px;max-width:52ch;}
  .top-chip{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    padding:8px 14px 8px 8px;border-radius:999px;cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .top-chip:hover{border-color:var(--line-strong);}
  .top-chip .name{font-weight:700;font-size:13.5px;}
  .top-chip .rating{color:var(--ink-muted);font-size:12px;}

  /* ---------- avatar ---------- */
  .avatar{
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:600;flex:none;
  }

  /* ---------- landing ---------- */
  .landing{
    min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
    background:var(--bg);
  }
  .landing::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(circle, rgba(23,22,15,0.38) 1px, transparent 1.3px);
    background-size:6px 6px;
    -webkit-mask-image:radial-gradient(ellipse 46% 58% at 28% 46%, transparent 45%, black 100%);
    mask-image:radial-gradient(ellipse 46% 58% at 28% 46%, transparent 45%, black 100%);
  }
  .landing-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:26px 40px;}
  .landing-body{position:relative;z-index:2;flex:1;display:flex;align-items:center;padding:20px 40px 60px;}
  .landing-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:60px;max-width:1180px;margin:0 auto;align-items:center;width:100%;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;
    color:var(--ink-muted);margin-bottom:20px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);}
  .landing h1{font-size:54px;letter-spacing:-0.03em;font-weight:800;}
  .landing h1 .strike{position:relative;white-space:nowrap;}
  .landing h1 .strike::after{
    content:"";position:absolute;left:-0.02em;right:-0.02em;top:52%;height:0.07em;
    background:var(--ink);transform:rotate(-2deg);
  }
  .landing .lede{margin-top:18px;font-size:16.5px;color:var(--ink-muted);max-width:46ch;}
  .landing .cta-row{margin-top:30px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .landing .cta-row .btn{padding:13px 26px;font-size:14.5px;}
  .stat-strip{display:flex;gap:28px;margin-top:40px;flex-wrap:wrap;}
  .stat-strip .s-num{font-family:var(--font-mono);font-size:22px;font-weight:600;}
  .stat-strip .s-lbl{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}

  .swap-preview{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;
    box-shadow:var(--shadow-lg);position:relative;
  }
  .swap-preview .row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;}
  .swap-preview .row + .row{margin-top:8px;}
  .swap-preview .versus{
    display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0;color:var(--ink-faint);
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  }
  .swap-preview .versus::before,.swap-preview .versus::after{content:"";flex:1;height:1px;background:var(--line);}
  .swap-card{background:var(--surface-2);border-radius:16px;padding:14px;}
  .swap-match{
    display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-strong);
  }
  .swap-match .pct{font-family:var(--font-mono);font-size:26px;font-weight:600;color:var(--ink);}

  /* ---------- tags ---------- */
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
    font-size:12.2px;font-weight:700;line-height:1.4;
  }
  .tag-teach{background:var(--ink);color:var(--bg);border:1px solid var(--ink);}
  .tag-learn{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
  .tag-muted{background:var(--surface-2);color:var(--ink-muted);}
  .taglabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:700;margin-bottom:7px;display:block;}

  /* ---------- onboarding ---------- */
  .onb-wrap{max-width:680px;margin:0 auto;padding:48px 24px 80px;position:relative;z-index:2;}
  .onb-progress{display:flex;gap:6px;margin-bottom:28px;}
  .onb-progress i{flex:1;height:4px;border-radius:4px;background:var(--line);}
  .onb-progress i.done{background:var(--teach);}
  .onb-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:34px;box-shadow:var(--shadow-lg);}
  .onb-step-label{font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .onb-card h2{font-size:23px;margin-bottom:6px;}
  .onb-card .onb-help{color:var(--ink-muted);font-size:13.8px;margin-bottom:24px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--ink-muted);}
  .field input[type=text],.field textarea,.field select{
    width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line-strong);
    background:var(--bg);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:8px 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);
    font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-muted);transition:all .12s ease;
  }
  .chip:hover{border-color:var(--ink);}
  .chip.sel-teach{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .chip.sel-learn{background:transparent;border-color:var(--ink);border-width:2px;color:var(--ink);}
  .chip-cat{margin-bottom:16px;}
  .chip-cat .u-caps{margin-bottom:8px;}
  .onb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}
  .onb-count{font-size:12.5px;color:var(--ink-faint);}

  /* ---------- dashboard / matches ---------- */
  .toppick{
    background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);
    border-radius:var(--radius-card);padding:24px;margin-bottom:28px;
    display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;box-shadow:var(--shadow-sm);
  }
  .toppick .tp-label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);margin-bottom:10px;}
  .toppick .tp-label svg{width:14px;height:14px;}
  .toppick h3{font-size:19px;margin-bottom:10px;}
  .reasons{display:flex;flex-direction:column;gap:6px;}
  .reasons li{list-style:none;display:flex;gap:8px;font-size:13.3px;color:var(--ink-muted);align-items:flex-start;}
  .reasons li svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:var(--ink);}
  .toppick .tp-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;}

  .ring{position:relative;display:flex;align-items:center;justify-content:center;flex:none;}
  .ring .ring-num{position:absolute;font-family:var(--font-mono);font-weight:600;text-align:center;line-height:1.1;}
  .ring .ring-num small{display:block;font-size:0.32em;font-weight:600;color:var(--ink-faint);letter-spacing:.03em;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 14px;gap:12px;flex-wrap:wrap;}
  .section-head h2{font-size:17px;}
  .section-head .count{color:var(--ink-faint);font-size:13px;}

  .match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .match-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;
    display:flex;flex-direction:column;gap:12px;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .match-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-strong);}
  .match-card .mc-top{display:flex;gap:12px;align-items:center;}
  .match-card .mc-who{flex:1;min-width:0;}
  .match-card .mc-who .n{font-weight:700;font-size:14.8px;}
  .match-card .mc-who .y{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .match-card .mc-band{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 0;}
  .band-excellent{color:var(--ink);}
  .band-good{color:var(--ink);opacity:0.75;}
  .band-fair{color:var(--ink-muted);}
  .band-low{color:var(--ink-faint);}
  .mc-stats{display:flex;gap:14px;font-size:12px;color:var(--ink-muted);}
  .mc-stats b{color:var(--ink);font-family:var(--font-mono);font-weight:600;}
  .mc-actions{display:flex;gap:8px;margin-top:auto;}
  .mc-actions .btn{flex:1;}

  /* ---------- rating stars ---------- */
  .stars{display:inline-flex;gap:2px;}
  .stars svg{width:14px;height:14px;}
  .star-fill{fill:var(--ink);stroke:var(--ink);}
  .star-empty{fill:none;stroke:var(--line-strong);}
  .stars.lg svg{width:26px;height:26px;cursor:pointer;}

  /* ---------- profile ---------- */
  .profile-hero{
    display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:26px;margin-bottom:22px;
  }
  .profile-hero .ph-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .profile-hero h1{font-size:23px;}
  .profile-hero .ph-year{color:var(--ink-muted);font-size:13.5px;margin-top:4px;}
  .profile-hero .ph-bio{margin-top:12px;font-size:14px;color:var(--ink-muted);max-width:56ch;}
  .profile-hero .ph-meta{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-faint);}
  .stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;}
  .stat-tile .v{font-family:var(--font-mono);font-size:22px;font-weight:600;}
  .stat-tile .l{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:20px 22px;margin-bottom:18px;}
  .panel h3{font-size:14.5px;margin-bottom:14px;}
  .skills-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:10px;}
  .badge{
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--surface-2);
    border:1px solid var(--line);font-size:12.8px;font-weight:700;
  }
  .badge .bicon{
    width:26px;height:26px;border-radius:50%;background:var(--ink);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .badge .bicon svg{width:13px;height:13px;stroke:#fff;}

  /* ---------- lists / sessions ---------- */
  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;width:fit-content;margin-bottom:18px;}
  .tab-btn{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-muted);cursor:pointer;}
  .tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);}
  .list-row{
    display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:10px;
  }
  .list-row .lr-main{flex:1;min-width:0;}
  .list-row .lr-title{font-weight:700;font-size:14.3px;}
  .list-row .lr-sub{font-size:12.5px;color:var(--ink-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .list-row .lr-sub svg{width:12px;height:12px;vertical-align:-1px;margin-right:2px;}
  .status-pill{padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  .status-upcoming{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
  .status-completed{background:var(--ink);color:var(--bg);}
  .status-pending{background:var(--surface-2);color:var(--ink-muted);}

  .empty-state{
    text-align:center;padding:60px 24px;background:var(--surface);border:1px dashed var(--line-strong);
    border-radius:var(--radius-card);color:var(--ink-muted);
  }
  .empty-state svg{width:36px;height:36px;stroke:var(--ink-faint);margin-bottom:14px;}
  .empty-state h3{font-size:16px;color:var(--ink);margin-bottom:6px;}
  .empty-state p{max-width:40ch;margin:0 auto 18px;font-size:13.8px;}

  /* ---------- session workspace ---------- */
  .session-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .session-head .sh-title{font-size:20px;}
  .session-head .sh-sub{color:var(--ink-muted);font-size:13.5px;margin-top:5px;}
  .session-head .sh-sub svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px;}
  .chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px;}
  .workspace{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  .chat-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);display:flex;flex-direction:column;height:480px;}
  .chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13.6px;line-height:1.45;}
  .msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;}
  .msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px;}
  .msg .ts{display:block;font-size:10px;opacity:0.65;margin-top:4px;}
  .chat-input-row{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);}
  .chat-input-row input{flex:1;border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:10px 16px;color:var(--ink);}
  .side-stack{display:flex;flex-direction:column;gap:16px;}
  .notes-box textarea{
    width:100%;min-height:150px;border:1px solid var(--line-strong);border-radius:12px;padding:12px;
    background:var(--bg);color:var(--ink);resize:vertical;font-size:13.5px;
  }
  .autosave-note{font-size:11px;color:var(--ink-faint);margin-top:6px;}
  .resource-item{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--surface-2);
    font-size:13px;margin-bottom:7px;
  }
  .resource-item svg{width:14px;height:14px;flex:none;stroke:var(--ink-muted);}
  .resource-item a{font-weight:700;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .add-resource-row{display:flex;gap:6px;margin-top:10px;}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }

  return `<div class="avatar" style="${style}">${esc(initials(u.name))}</div>`;

/* ============================== MATCHING ============================== */
function computeMatch(u, them){
  const theirWant = them.want.length ? them.want : [];
  const yourWant = u.want.length ? u.want : [];
  const theirNeedMet = theirWant.length ? intersect(u.teach, theirWant).length / theirWant.length : 0;
  const yourNeedMet = yourWant.length ? intersect(u.want, them.teach).length / yourWant.length : 0;
  const mutual = (theirNeedMet + yourNeedMet) / 2;
  const availOverlap = intersect(u.availability, them.availability).length;
  const availBonus = Math.min(availOverlap * 0.045, 0.09);
  const ratingBonus = Math.max(0, (them.rating - 4.5)) * 0.04;
  let raw = mutual * 0.85 + 0.10 + availBonus + ratingBonus;
  raw = Math.max(0.06, Math.min(0.99, raw));
  return Math.round(raw*100);
}
function intersect(a,b){ return a.filter(x=>b.includes(x)); }
function matchReasons(u, them){
  const list = [];
  const learnTheyTeach = intersect(u.want, them.teach);
  const teachTheyWant = intersect(u.teach, them.want);
  if(learnTheyTeach.length) list.push(`Teaches ${joinList(learnTheyTeach)} — exactly what you want to learn`);
  if(teachTheyWant.length) list.push(`Wants ${joinList(teachTheyWant)} — which you can teach`);
  const avail = intersect(u.availability, them.availability);
  if(avail.length) list.push(`${avail.length} overlapping free ${avail.length>1?"slots":"slot"}: ${joinList(avail)}`);
  list.push(`${them.rating.toFixed(1)}★ rating across ${them.sessionsCompleted} sessions`);
  return list;
}

}

  else if(ob.step===3) body = onbStep2("learn");

function renderDashboard(){
  const u = you();

  let topHTML = "";
  if(top){
    const reasons = matchReasons(u, top.user).map(r=>`<li>${icon("check")}<span>${esc(r)}</span></li>`).join("");
    const pend = pendingRequestTo(top.user.id);
    topHTML = `
    <div class="toppick">

        <div class="tp-label">${icon("sparkle")} Smart top pick</div>

        ${requestButton(top.user.id, pend)}
      </div>
    </div>`;
  }

  const grid = rest.map(m=>matchCard(u,m)).join("");

  return renderShell(`
    <div class="topbar">

  `);

function matchRing(score, size){
  size = size||64;
  const r = (size-8)/2, c = 2*Math.PI*r;
  const off = c*(1-score/100);
  return `
  <div class="ring" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--teach)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="ring-num" style="font-size:${Math.round(size*0.24)}px;">${score}<small>PERCENT</small></div>
  </div>`;
}
function topChip(u){
  return `<div class="top-chip" data-act="go" data-tab="profile">${avatarHTML(u,34)}<div><div class="name">${esc(u.name)}</div><div class="rating">${u.rating.toFixed(1)}★ · ${u.sessionsCompleted} sessions</div></div></div>`;
}
function pendingRequestTo(userId){
  const u = you();
  return state.requests.find(r=>r.fromId===u.id && r.toId===userId && r.status!=="declined");
}
function requestButton(userId, pend){
  if(pend && pend.status==="pending") return `<button class="btn btn-soft" disabled>Request sent…</button>`;
  if(pend && pend.status==="accepted"){
    const hasSession = state.sessions.some(s=>s.requestId===pend.id);
    if(hasSession) return `<button class="btn btn-soft" data-act="go" data-tab="sessions">View session</button>`;
    return `<button class="btn btn-primary" data-act="open-schedule" data-req="${pend.id}">Schedule session</button>`;
  }
  return `<button class="btn btn-primary" data-act="open-request" data-id="${userId}">Send request</button>`;
}
function matchCard(u, m){
  const them = m.user;
  const band = scoreBand(m.score);
  const pend = pendingRequestTo(them.id);
  return `
  <div class="match-card">
    <div class="mc-top">
      ${avatarHTML(them,48)}
      <div class="mc-who">
        <div class="n">${esc(them.name)}</div>
        <div class="y">${esc(them.year)}</div>
      </div>
      ${matchRing(m.score, 56)}
    </div>
    <div class="mc-band ${band.cls}">${band.label}</div>
    <div>
      <span class="taglabel">Can teach you</span>
      ${tagList(intersect(u.want, them.teach).length ? intersect(u.want,them.teach) : them.teach.slice(0,2), "teach")}
    </div>
    <div>
      <span class="taglabel">Wants to learn</span>
      ${tagList(intersect(u.teach, them.want).length ? intersect(u.teach,them.want) : them.want, "learn")}
    </div>
    <div class="mc-stats">
      <span>${starsHTML(them.rating)} <b>${them.rating.toFixed(1)}</b></span>
      <span><b>${them.sessionsCompleted}</b> sessions</span>
    </div>
    <div class="mc-actions">
      <button class="btn btn-ghost btn-sm" data-act="view-profile" data-id="${them.id}">Profile</button>
      ${pend ? `<button class="btn btn-soft btn-sm" data-act="${pend.status==='accepted' && !state.sessions.some(s=>s.requestId===pend.id) ? 'open-schedule' : 'go'}" ${pend.status==='accepted' && !state.sessions.some(s=>s.requestId===pend.id) ? `data-req="${pend.id}"` : `data-tab="sessions"`}>${pend.status==="pending"?"Pending…":(state.sessions.some(s=>s.requestId===pend.id)?"View session":"Schedule")}</button>`
             : `<button class="btn btn-primary btn-sm" data-act="open-request" data-id="${them.id}">Request</button>`}
    </div>
  </div>`;
}

    <div class="tabs">
      <div class="tab-btn ${tab==='upcoming'?'active':''}" data-act="sessions-tab" data-sub="upcoming">Upcoming (${upcoming.length})</div>
      <div class="tab-btn ${tab==='completed'?'active':''}" data-act="sessions-tab" data-sub="completed">Completed (${completed.length})</div>
    </div>
    ${rows}
  `);
}
function sessionRow(s){
  const them = state.users[s.withId];
  const statusCls = s.status==="upcoming" ? "status-upcoming" : "status-completed";
  return `
  <div class="list-row" ${s.status==='upcoming'?`data-act="open-session" data-id="${s.id}"`:''} style="${s.status==='upcoming'?'cursor:pointer;':''}">
    ${avatarHTML(them,44)}
    <div class="lr-main">
      <div class="lr-title">${esc(s.skillFocus)} with ${esc(them.name)}</div>
      <div class="lr-sub">
        <span>${icon("calendar")}${fmtDateNice(s.date)} · ${esc(s.time)}</span>
        <span>${icon("clock")}${s.duration} min</span>
        <span class="status-pill ${statusCls}">${s.status}</span>
      </div>
    </div>
    ${s.status==="upcoming" ? `<button class="btn btn-primary btn-sm" data-act="open-session" data-id="${s.id}">Enter session</button>`
      : `<div style="text-align:right;"><div style="font-size:12px;color:var(--ink-muted);">You rated</div>${starsHTML(s.ratingGiven||5)}</div>`}
  </div>`;
}

/* ============================== SESSION WORKSPACE ============================== */
function renderSessionWorkspace(){
  const s = state.sessions.find(x=>x.id===state.route.sessionId);
  const them = state.users[s.withId];
  const chat = s.chat.map(m=>`<div class="msg ${m.from==='you'?'me':'them'}">${esc(m.text)}<span class="ts">${m.from==='you'?'You':esc(them.name.split(' ')[0])} · ${esc(m.ts)}</span></div>`).join("");

  return renderShell(`
    <button class="btn btn-ghost btn-sm" data-act="go" data-tab="sessions" style="margin-bottom:16px;">${icon("chevronR")} Back to sessions</button>
    <div class="session-head">
      <div>
        <div class="sh-title" style="font-family:var(--font-display);font-weight:600;">${esc(s.skillFocus)} session with ${esc(them.name)}</div>
        <div class="sh-sub">${fmtDateNice(s.date)} · ${esc(s.time)} · ${s.duration} min · ${icon("video")} Video call</div>
      </div>
      <button class="btn btn-primary" data-act="open-complete">Mark session complete ${icon("checkCircle")}</button>
    </div>
    <div class="workspace">
      <div class="chat-panel">
        <div class="chat-log" id="chatLog">${chat}</div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Message ${esc(them.name.split(' ')[0])}…">
          <button class="btn btn-primary btn-sm" data-act="send-chat">${icon("send")}</button>
        </div>
      </div>
      <div class="side-stack">
        <div class="panel notes-box" style="margin-bottom:0;">
          <h3>Shared notes</h3>
          <textarea id="sessionNotes" placeholder="Jot down what you're covering, questions, homework...">${esc(s.notes||"")}</textarea>
          <div class="autosave-note">Autosaves as you type — visible to both of you.</div>
        </div>
        <div class="panel" style="margin-bottom:0;">
          <h3>Resources</h3>
          ${s.resources.length ? s.resources.map(r=>`<div class="resource-item">${icon("link")}<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a></div>`).join("") : `<p style="font-size:12.8px;color:var(--ink-faint);">No resources shared yet.</p>`}
          <div class="add-resource-row">
            <input id="resLabel" type="text" placeholder="Label">
            <input id="resUrl" type="text" placeholder="URL">
            <button class="btn btn-soft btn-sm" data-act="add-resource">${icon("plus")}</button>
          </div>
        </div>
      </div>
    </div>
  `);
}

/* ============================== COMPLETE / RATING MODAL ============================== */
function completeModal(){
  const s = state.sessions.find(x=>x.id===state.route.sessionId);
  const them = state.users[s.withId];
  if(!state.modal.stars) state.modal.stars = 5;
  if(!state.modal.tags) state.modal.tags = [];
  const suggestedBadge = suggestBadgeFor(s.skillFocus);

  return `
  <div class="modal-veil" data-act="close-modal">
    <div class="modal" data-act="noop">
      <div class="modal-head"><h2>Rate your session</h2><button class="modal-close" data-act="close-modal">${icon("close")}</button></div>
      <p class="modal-sub">How was ${esc(them.name.split(" ")[0])}'s teaching on <strong>${esc(s.skillFocus)}</strong>?</p>
      <div style="text-align:center;margin:18px 0;">${interactiveStars(state.modal.stars)}</div>
      <div class="feedback-tags">
        ${["Clear explanations","Patient","Well prepared","Fun to learn with"].map(t=>`<div class="chip ${state.modal.tags.includes(t)?"sel-teach":""}" data-act="rate-tag" data-tag="${t}">${t}</div>`).join("")}
      </div>
      <div class="field"><label for="rate-comment">Comment <span style="text-transform:none;font-weight:500;color:var(--ink-faint);">(optional)</span></label><textarea id="rate-comment" placeholder="What stood out?"></textarea></div>
      <div class="field">
        <label>Award a badge <span style="text-transform:none;font-weight:500;color:var(--ink-faint);">(optional)</span></label>
        <div class="select-row">${BADGE_OPTIONS.concat(suggestedBadge?[suggestedBadge]:[]).filter((v,i,a)=>a.indexOf(v)===i).map(b=>`<div class="chip ${state.modal.badge===b?"sel-learn":""}" data-act="rate-badge" data-badge="${esc(b)}">${icon("badge")} ${esc(b)}</div>`).join("")}</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-block" data-act="submit-rating">Submit &amp; complete session</button>
      </div>
    </div>
  </div>`;
}
function logoutModal(){
  const u = you();
  return `
  <div class="modal-veil" data-act="close-modal">
    <div class="modal" data-act="noop" style="max-width:400px;">
      <div class="modal-head"><h2>Log out?</h2><button class="modal-close" data-act="close-modal">${icon("close")}</button></div>
      <p class="modal-sub">This permanently clears <strong>${esc(u.name)}</strong>'s profile, matches, requests, sessions, and progress from this browser. There's no backend behind this prototype, so once it's cleared it can't be recovered — you'd start over from sign-up.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-act="close-modal">Cancel</button>
        <button class="btn btn-danger" data-act="confirm-logout">Log out &amp; clear data</button>
      </div>
    </div>
  </div>`;
}
function suggestBadgeFor(skill){
  const map = {"Python":"Python Mentor","JavaScript":"JS Mentor","React":"React Mentor","Guitar":"Music Maestro","Photoshop":"Design Guru","UI/UX Design":"Design Guru","Public Speaking":"Pitch Perfect"};
  return map[skill] || null;
}

/* ============================== PROGRESS ============================== */
function renderProgress(){
  const u = you();
  const skills = Object.keys(state.progress);
  const totalSessions = u.sessionsCompleted;
  const hours = Math.round(Object.values(state.progress).reduce((acc,p)=>acc+p.sessionsCount,0) * 0.75 * 10)/10;

  const cards = skills.length ? skills.map(sk=>progressCard(sk)).join("") : `
    <div class="empty-state">${icon("trend")}<h3>No skills in progress</h3><p>Complete your first session and we'll start tracking topics and progress here automatically.</p>
    <button class="btn btn-primary btn-sm" data-act="go" data-tab="dashboard">Find a match</button></div>`;

  return renderShell(`
    <div class="topbar">
      <div><h1>Progress</h1><p class="sub">Topics you've covered in each skill you're learning.</p></div>
      ${topChip(u)}
    </div>
    <div class="stat-tiles">
      <div class="stat-tile"><div class="v mono">${skills.length}</div><div class="l">Skills in progress</div></div>
      <div class="stat-tile"><div class="v mono">${totalSessions}</div><div class="l">Total sessions</div></div>
      <div class="stat-tile"><div class="v mono">${hours}h</div><div class="l">Est. hours learned</div></div>
      <div class="stat-tile"><div class="v mono">${u.badges.length}</div><div class="l">Badges earned</div></div>
    </div>
    ${cards}
  `);
}
function progressCard(skill){
  const p = state.progress[skill];
  const topics = TOPICS[skill] || ["Fundamentals","Core Techniques","Practical Project","Advanced Concepts","Real-world Application"];
  const pct = Math.round((p.completedTopics.length/topics.length)*100);
  return `
  <div class="progress-card">
    <div class="pc-top">
      <h3>${esc(skill)}</h3>
      <span class="pc-pct">${pct}%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
    <div class="topic-list">
      ${topics.map(t=>`<div class="topic ${p.completedTopics.includes(t)?"done":""}">${icon(p.completedTopics.includes(t)?"checkCircle":"circle")}${esc(t)}</div>`).join("")}
    </div>
    <div class="pc-meta">
      <span>${p.sessionsCount} session${p.sessionsCount===1?"":"s"}</span>
      <span>Last session ${fmtDateNice(p.lastSession)}</span>
    </div>
  </div>`;
}

/* ============================== COMMUNITY ============================== */
function renderCommunity(){
  const u = you();
  const all = Object.values(state.users);
  const skillCounts = {};
  all.forEach(p=>{ p.teach.forEach(s=>skillCounts[s]=(skillCounts[s]||0)+1); p.want.forEach(s=>skillCounts[s]=(skillCounts[s]||0)+1); });
  const popular = Object.entries(skillCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCount = popular.length ? popular[0][1] : 1;

  const dirCards = all.map(p=>`
    <div class="dir-card" data-act="view-profile" data-id="${p.id}">
      ${avatarHTML(p,56)}
      <div class="n">${esc(p.name)}</div>
      <div class="y">${esc(p.year.split("·")[0].trim())}</div>
      <div class="tags" style="justify-content:center;">${p.teach.slice(0,2).map(s=>`<span class="tag tag-teach">${esc(s)}</span>`).join("")}</div>
    </div>`).join("");

  return renderShell(`
    <div class="topbar">
      <div><h1>${esc(u.school)} community</h1><p class="sub">${all.length+1} students trading skills in your network right now.</p></div>
      ${topChip(u)}
    </div>
    <div class="community-grid">
      <div>
        <div class="section-head" style="margin-top:0;"><h2>Active learners</h2><span class="count">${all.length} people</span></div>
        <div class="directory-grid">${dirCards}</div>
      </div>
      <div>
        <div class="panel" style="margin-bottom:0;">
          <h3>Popular skills</h3>
          ${popular.map(([s,c])=>`
            <div class="pop-skill-row">
              <div class="lbl">${esc(s)}</div>
              <div class="pop-skill-track"><div class="pop-skill-fill" style="width:${Math.round((c/maxCount)*100)}%;"></div></div>
              <div class="pop-skill-n mono">${c}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `);
}

/* ============================== ROUTER / RENDER ============================== */
function render(){
  const app = document.getElementById("app");
  const route = state.route;
  let html = "";
  if(route.tab==="landing") html = renderLanding();
  else if(route.tab==="onboarding") html = renderOnboarding();
  else if(route.tab==="dashboard") html = renderDashboard();
  else if(route.tab==="profile") html = renderProfile();
  else if(route.tab==="sessions") html = renderSessions();
  else if(route.tab==="session") html = renderSessionWorkspace();
  else if(route.tab==="progress") html = renderProgress();
  else if(route.tab==="community") html = renderCommunity();
  else html = renderLanding();

  let modalHTML = "";
  if(state.modal){
    if(state.modal.type==="request") modalHTML = requestModal();
    else if(state.modal.type==="schedule") modalHTML = scheduleModal();
    else if(state.modal.type==="complete") modalHTML = completeModal();
    else if(state.modal.type==="logout") modalHTML = logoutModal();
  }
  app.innerHTML = html + modalHTML;

  if(route.tab==="session"){
    const log = document.getElementById("chatLog");
    if(log) log.scrollTop = log.scrollHeight;
    const notes = document.getElementById("sessionNotes");
    if(notes) notes.addEventListener("input", (e)=>{
      const s = state.sessions.find(x=>x.id===state.route.sessionId);
      if(s){ s.notes = e.target.value; saveState(); }
    });
  }
  saveState();
}

/* ============================== ACTIONS ============================== */
function go(tab, extra){
  state.route = Object.assign({tab}, extra||{});
  state.modal = null;
  window.scrollTo({top:0});
  render();
}

function logOut(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){ /* storage unavailable, continue in-memory */ }
  state = freshState();
  window.scrollTo({top:0});
  render();
  toast("You've been logged out — your account data was cleared.");
}

document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]");
  if(!t) return;
  const act = t.dataset.act;

  if(act==="noop"){ return; }
  if(act==="go"){ go(t.dataset.tab); return; }
  if(act==="view-profile"){ go("profile", {userId:t.dataset.id}); return; }
  if(act==="close-modal"){ state.modal=null; render(); return; }

  if(act==="onb-next-1"){
    const name = document.getElementById("f-name").value.trim();
    if(!name){ toast("Please enter your name to continue."); return; }
    state.onboarding.name = name;
    state.onboarding.school = document.getElementById("f-school").value.trim();
    state.onboarding.year = document.getElementById("f-year").value.trim();
    state.onboarding.bio = document.getElementById("f-bio").value.trim();
    state.onboarding.step = 2;
    render(); return;
  }
  if(act==="onb-toggle"){
    const kind = t.dataset.kind, skill = t.dataset.skill;
    const arr = state.onboarding[kind];
    const idx = arr.indexOf(skill);
    if(idx>-1) arr.splice(idx,1);
    else { if(arr.length>=4){ toast("You can pick up to 4 skills here."); return; } arr.push(skill); }
    render(); return;
  }
  if(act==="onb-next-teach"){ state.onboarding.step=3; render(); return; }
  if(act==="onb-next-learn"){ state.onboarding.step=4; render(); return; }
  if(act==="onb-back"){ state.onboarding.step = Math.max(1,state.onboarding.step-1); render(); return; }
  if(act==="onb-toggle-avail"){
    const slot = t.dataset.slot;
    const arr = state.onboarding.availability;
    const idx = arr.indexOf(slot);
    if(idx>-1) arr.splice(idx,1); else arr.push(slot);
    render(); return;
  }
  if(act==="onb-add-avail"){
    const input = document.getElementById("customAvailInput");
    const val = input.value.trim();
    if(!val){ toast("Type a slot before adding it."); return; }
    const ob = state.onboarding;
    const exists = [...AVAILABILITY_OPTIONS, ...ob.customAvailability].some(a=>a.toLowerCase()===val.toLowerCase());
    if(exists){ toast("That slot is already on your list."); return; }
    ob.customAvailability.push(val);
    render(); return;
  }
  if(act==="onb-remove-custom-avail"){
    const ob = state.onboarding;
    const idx = ob.customAvailability.indexOf(t.dataset.slot);
    if(idx>-1) ob.customAvailability.splice(idx,1);
    render(); return;
  }
  if(act==="onb-finish"){
    const ob = state.onboarding;
    const id = "you";
    state.users[id] = {
      id, name: ob.name, school: ob.school||"Independent", year: ob.year||"Undeclared",
      bio: ob.bio, teach: ob.teach.slice(), want: ob.learn.slice(), availability: ob.availability.concat(ob.customAvailability),
      rating: 0, sessionsCompleted: 0, badges: [], memberSince: new Date().toLocaleDateString(undefined,{month:"short",year:"numeric"}),
      hue: hashStr(ob.name)%360
    };
    state.currentUserId = id;
    toast("Welcome to SkillSwap, "+ob.name.split(" ")[0]+"!");
    go("dashboard");
    return;
  }

  if(act==="open-request"){ state.modal={type:"request", userId:t.dataset.id}; render(); return; }
  if(act==="req-pick"){ state.modal[t.dataset.field] = t.dataset.val; render(); return; }
  if(act==="send-request"){
    const u = you();
    const modal = state.modal;
    const them = state.users[modal.userId];
    const msg = document.getElementById("req-msg").value.trim();
    const req = {id:uid("req"), fromId:u.id, toId:them.id, teachSkill:modal.draftTeach, learnSkill:modal.draftLearn, message: msg, status:"pending", createdAt: Date.now()};
    state.requests.push(req);
    state.modal = null;
    toast("Request sent to "+them.name.split(" ")[0]+".");
    render();
    setTimeout(()=>{
      req.status = "accepted";
      toast(them.name.split(" ")[0]+" accepted your swap request!");
      render();
    }, 1400);
    return;
  }

  if(act==="open-schedule"){ state.modal={type:"schedule", reqId:t.dataset.req}; render(); return; }
  if(act==="sch-pick"){ state.modal[t.dataset.field] = t.dataset.field==="duration" ? parseInt(t.dataset.val,10) : t.dataset.val; render(); return; }
  if(act==="confirm-schedule"){
    const modal = state.modal;
    const req = state.requests.find(r=>r.id===modal.reqId);
    const u = you();
    const withId = req.fromId===u.id ? req.toId : req.fromId;
    const dateVal = document.getElementById("sch-date").value || todayISO();
    const notesVal = document.getElementById("sch-notes").value.trim();
    const session = {
      id: uid("sess"), requestId: req.id, withId, userId:u.id,
      skillFocus: req.learnSkill, teachSkill: req.teachSkill,
      date: dateVal, time: modal.time, duration: modal.duration,
      status:"upcoming", notes: notesVal, resources: [],
      chat: seedChat(withId)
    };
    state.sessions.push(session);
    state.modal = null;
    toast("Session scheduled with "+state.users[withId].name.split(" ")[0]+".");
    go("sessions", {subtab:"upcoming"});
    return;
  }

  if(act==="sessions-tab"){ state.route.subtab = t.dataset.sub; render(); return; }
  if(act==="open-session"){ go("session", {sessionId:t.dataset.id}); return; }

  if(act==="send-chat"){
    const input = document.getElementById("chatInput");
    const val = input.value.trim();
    if(!val) return;
    const s = state.sessions.find(x=>x.id===state.route.sessionId);
    s.chat.push({from:"you", text:val, ts: nowTime()});
    input.value = "";
    render();
    const box = document.getElementById("chatInput");
    if(box) box.focus();
    setTimeout(()=>{
      const them = state.users[s.withId];
      s.chat.push({from:"them", text: pickReply(), ts: nowTime()});
      if(state.route.tab==="session" && state.route.sessionId===s.id) render();
    }, 1100);
    return;
  }
  if(act==="add-resource"){
    const label = document.getElementById("resLabel").value.trim();
    const url = document.getElementById("resUrl").value.trim();
    if(!label || !url){ toast("Add both a label and a URL."); return; }
    const s = state.sessions.find(x=>x.id===state.route.sessionId);
    s.resources.push({label, url: url.startsWith("http")?url:"https://"+url});
    render();
    return;
  }

  if(act==="open-complete"){ state.modal={type:"complete"}; render(); return; }
  if(act==="open-logout"){ state.modal={type:"logout"}; render(); return; }
  if(act==="confirm-logout"){ logOut(); return; }
  if(act==="rate-star"){ state.modal.stars = parseInt(t.dataset.val,10); render(); return; }
  if(act==="rate-tag"){
    const tag = t.dataset.tag;
    const arr = state.modal.tags;
    const idx = arr.indexOf(tag);
    if(idx>-1) arr.splice(idx,1); else arr.push(tag);
    render(); return;
  }
  if(act==="rate-badge"){
    state.modal.badge = state.modal.badge===t.dataset.badge ? null : t.dataset.badge;
    render(); return;
  }
  if(act==="submit-rating"){
    completeSession();
    return;
  }
});

function nowTime(){ return new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function seedChat(withId){
  const them = state.users[withId];
  const opener = `Hey! Looking forward to our session — I'll bring some questions on ${state_getSkillPlaceholder()}.`;
  return [
    {from:"them", text:`Hi! Excited to swap skills with you 🙂`, ts: nowTime()},
    {from:"them", text:`Feel free to drop any resources or questions here beforehand.`, ts: nowTime()}
  ];
}
function state_getSkillPlaceholder(){ return "this"; }
function pickReply(){
  const replies = [
    "Sounds good, I'll prep something on that.",
    "Good question — let's cover that at the start.",
    "Yep, I'll share a resource for that after.",
    "Makes sense, see you at our session!",
    "Great point, noted it in the shared notes."
  ];
  return replies[Math.floor(Math.random()*replies.length)];
}

function completeSession(){
  const s = state.sessions.find(x=>x.id===state.route.sessionId);
  const u = you();
  const them = state.users[s.withId];
  const modal = state.modal;
  const comment = (document.getElementById("rate-comment")||{}).value || "";

  s.status = "completed";
  s.ratingGiven = modal.stars;
  s.ratingComment = comment;

  // update partner (the person you rated)
  const newCount = them.sessionsCompleted + 1;
  them.rating = Math.round(((them.rating*them.sessionsCompleted + modal.stars)/newCount)*10)/10;
  them.sessionsCompleted = newCount;
  if(modal.badge && !them.badges.includes(modal.badge)) them.badges.push(modal.badge);

  // simulate partner rating you back
  const theirRatingOfYou = 5;
  const yourNewCount = u.sessionsCompleted + 1;
  u.rating = u.sessionsCompleted ? Math.round(((u.rating*u.sessionsCompleted + theirRatingOfYou)/yourNewCount)*10)/10 : theirRatingOfYou;
  u.sessionsCompleted = yourNewCount;
  if(u.sessionsCompleted===1 && !u.badges.includes("Rising Star")) u.badges.push("Rising Star");

  // update progress on the skill you learned
  const skill = s.skillFocus;
  if(!state.progress[skill]) state.progress[skill] = {completedTopics:[], sessionsCount:0, lastSession:null};
  const p = state.progress[skill];
  const topics = TOPICS[skill] || ["Fundamentals","Core Techniques","Practical Project","Advanced Concepts","Real-world Application"];
  const topicsToAdd = s.duration>=60 ? 2 : 1;
  for(let i=0;i<topicsToAdd;i++){
    const next = topics.find(t2=>!p.completedTopics.includes(t2));
    if(next) p.completedTopics.push(next);
  }
  p.sessionsCount += 1;
  p.lastSession = s.date;

  state.modal = null;
  toast("Session complete — "+skill+" progress updated!");
  go("progress");
}

/* ============================== INIT ============================== */
function init(){
  if(!state.route) state.route = {tab:"landing"};
  if(state.currentUserId && state.route.tab==="landing") state.route = {tab:"dashboard"};
  if(!state.currentUserId && state.route.tab!=="landing" && state.route.tab!=="onboarding") state.route = {tab:"landing"};
  render();
}
init();

})();
</script>
